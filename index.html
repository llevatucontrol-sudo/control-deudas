<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Deudas</title>

  <style>
    :root{
      --bg:#f4f6f8; --card:#fff; --text:#1f2937; --muted:#4b5563; --line:#e5e7eb;
      --ok:#16a34a; --bad:#dc2626; --info:#0ea5e9; --warn:#f59e0b;
    }
    body{
      font-family: Arial, sans-serif;
      background:var(--bg);
      margin:0;
      padding:40px;
      color:var(--text);
    }
    .wrap{ max-width:900px; margin:auto; }
    .card{
      background:var(--card);
      padding:26px;
      border-radius:14px;
      box-shadow:0 10px 25px rgba(0,0,0,.1);
      margin-bottom:16px;
    }
    h1{ margin:0 0 6px 0; font-size:34px; }
    .sub{ color:var(--muted); margin:0; }
    .row{ display:grid; grid-template-columns: 1.2fr .7fr .6fr; gap:10px; margin-top:16px; }
    input, select{
      width:100%;
      padding:12px;
      border:1px solid var(--line);
      border-radius:10px;
      font-size:14px;
    }
    button{
      border:0;
      padding:12px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
      font-size:14px;
    }
    .btn{ background:#111827; color:#fff; }
    .btn:hover{ opacity:.9; }

    .stats{
      margin-top:12px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fafafa;
      font-size:14px;
      line-height:1.5;
    }

    details.item{
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      margin-bottom:12px;
    }
    summary{
      cursor:pointer;
      padding:14px;
      display:grid;
      grid-template-columns: 1.2fr .7fr .7fr auto;
      gap:10px;
      align-items:center;
    }
    summary::-webkit-details-marker{ display:none; }

    .who{ font-weight:800; }
    .mini{ font-size:12px; color:var(--muted); }
    .money{ font-weight:800; }

    .tag{
      font-size:12px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid var(--line);
    }
    .pend{ background:#fff7ed; color:#9a3412; }
    .pag{ background:#ecfdf5; color:#166534; }
    .par{ background:#eff6ff; color:#1d4ed8; }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; }
    .ok{ background:var(--ok); color:#fff; }
    .del{ background:var(--bad); color:#fff; }
    .info{ background:var(--info); color:#fff; }

    .inside{
      border-top:1px solid var(--line);
      padding:14px;
      background:#fafafa;
    }

    .abonoRow{
      display:grid;
      grid-template-columns: 1fr .7fr auto;
      gap:10px;
      margin-bottom:10px;
    }

    .abonoItem{
      display:flex;
      justify-content:space-between;
      border-bottom:1px solid var(--line);
      padding:8px 0;
      font-size:14px;
    }

    .footer{
      text-align:center;
      font-size:12px;
      color:var(--muted);
      margin-top:10px;
    }

    @media(max-width:800px){
      body{ padding:18px; }
      .row{ grid-template-columns:1fr; }
      summary{ grid-template-columns:1fr; }
      .abonoRow{ grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="card">
    <h1>Control de Deudas</h1>
    <p class="sub">Organiza tus deudas paso a paso 💙</p>

    <div class="row">
      <input id="inpQuien" placeholder="¿A quién le debes? (Ej: Nona, Laura, Banco)">
      <input id="inpMonto" placeholder="Monto inicial" inputmode="numeric">
      <button class="btn" id="btnAgregar">Agregar deuda</button>
    </div>

    <div class="stats" id="stats"></div>

    <select id="filtro" style="margin-top:10px;">
      <option value="todas">Todas</option>
      <option value="pendientes">Pendientes</option>
      <option value="pagadas">Pagadas</option>
    </select>
  </div>

  <div class="card">
    <h3>Mis deudas</h3>
    <div id="lista"></div>
    <div class="footer">Tus datos se guardan solo en este dispositivo.</div>
  </div>

</div>

<script>
const KEY="controlDeudas_v3";
const inpQuien=document.getElementById("inpQuien");
const inpMonto=document.getElementById("inpMonto");
const btnAgregar=document.getElementById("btnAgregar");
const lista=document.getElementById("lista");
const filtro=document.getElementById("filtro");
const stats=document.getElementById("stats");

const money=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n);
const load=()=>JSON.parse(localStorage.getItem(KEY)||"[]");
const save=d=>localStorage.setItem(KEY,JSON.stringify(d));
const uid=()=>Math.random().toString(16).slice(2)+Date.now();

const saldo=d=>d.monto-(d.abonos||[]).reduce((a,b)=>a+b.monto,0);

btnAgregar.onclick=()=>{
  const q=inpQuien.value.trim();
  const m=parseInt(inpMonto.value.replace(/\D/g,""));
  if(!q||!m) return alert("Completa los datos");
  const d=load();
  d.unshift({id:uid(),quien:q,monto:m,abonos:[],fecha:new Date().toISOString()});
  save(d);
  inpQuien.value=""; inpMonto.value="";
  render();
};

function addAbono(id){
  const monto=parseInt(document.querySelector(`[data-m="${id}"]`).value.replace(/\D/g,""));
  const fecha=document.querySelector(`[data-f="${id}"]`).value;
  if(!monto||!fecha) return alert("Monto y fecha");
  const d=load();
  const it=d.find(x=>x.id===id);
  it.abonos.unshift({id:uid(),monto,fecha:new Date(fecha+"T12:00:00").toISOString()});
  save(d); render();
}

function render(){
  const d=load();
  const all=d.map(x=>({...x,saldo:saldo(x)}));
  stats.innerHTML=`Total: <b>${money(all.reduce((a,b)=>a+b.saldo,0))}</b>`;
  lista.innerHTML="";
  all.filter(x=>filtro.value==="todas"||filtro.value==="pendientes"&&x.saldo>0||filtro.value==="pagadas"&&x.saldo<=0)
  .forEach(x=>{
    lista.innerHTML+=`
    <details class="item">
      <summary>
        <div><div class="who">${x.quien}</div><div class="mini">${new Date(x.fecha).toLocaleDateString()}</div></div>
        <div><div class="mini">Inicial</div><div class="money">${money(x.monto)}</div></div>
        <div><div class="mini">Saldo</div><div class="money">${money(x.saldo)}</div></div>
        <div class="actions"><span class="tag ${x.saldo<=0?"pag":"par"}">${x.saldo<=0?"Pagada":"Con abonos"}</span></div>
      </summary>
      <div class="inside">
        <div class="abonoRow">
          <input data-m="${x.id}" placeholder="Monto abono">
          <input type="date" data-f="${x.id}">
          <button class="info" onclick="addAbono('${x.id}')">Guardar</button>
        </div>
        ${(x.abonos||[]).map(a=>`<div class="abonoItem"><div>${money(a.monto)}</div><div class="mini">${new Date(a.fecha).toLocaleDateString()}</div></div>`).join("")}
      </div>
    </details>`;
  });
}
render();
</script>
</body>
</html>
